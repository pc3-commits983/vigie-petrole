# Mesure ponctuelle de la couverture du flux AIS, région par région.
# Se lance à la main (Actions → Diagnostic AIS → Run workflow) ou quand le script change.
name: Diagnostic AIS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/diagnostic.py"

permissions:
  contents: read

jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Mesurer la couverture par région
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          DIAGNOSTIC_SECONDES: "60"
        run: python -m pipeline.diagnostic
