# Chaque heure : positions des pétroliers, cours, indicateurs clés ; PortWatch deux fois par jour ;
# sélection de l'agent toutes les 6 heures. Le site est ensuite publié sur GitHub Pages.
name: Vigie pétrole

on:
  schedule:
    - cron: "17 * * * *"
  # Republie aussi le site dès que le code de l'application change
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "site/**"
      - ".github/workflows/vigie.yml"
  workflow_dispatch:
    inputs:
      analyse:
        description: "Refaire la sélection de l'agent maintenant"
        type: boolean
        default: true

# Aucun droit par défaut : chaque tâche reçoit seulement ce dont elle a besoin
permissions: {}

concurrency:
  group: vigie-petrole
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Cette tâche manipule les clés et des données venues d'Internet : lecture seule sur le dépôt
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Collecter, analyser et construire le site
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FORCER_ANALYSE: ${{ github.event_name == 'workflow_dispatch' && inputs.analyse }}
        run: python -m pipeline.run --out _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
